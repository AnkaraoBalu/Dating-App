name: dating_app
description: A Flutter foundation for a dating app.
publish_to: 'none'
version: 1.0.1+5

environment:
  sdk: ^3.12.0

dependencies:
  app_links: ^6.4.1
  camera: ^0.12.1
  clerk_auth: ^0.0.18-beta
  clerk_flutter: ^0.0.18-beta
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^22.3.1
  flutter_ringtone_player: ^4.0.0+4
  geolocator: ^14.0.2
  http: ^1.6.0
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  livekit_client: ^2.13.1
  path_provider: ^2.1.6
  record: ^7.1.2
  shared_preferences: ^2.5.6
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.3

dependency_overrides:
  clerk_auth:
    path: packages/clerk_auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding/friday/
    - .env
    - assets/images/vibes/coffee_chats.jpg
    - assets/images/vibes/late_night_talks.jpg
    - assets/images/vibes/live_music.jpg
    - assets/images/vibes/food_adventures.jpg
    - assets/images/vibes/mountain_travel.jpg
    - assets/images/vibes/beach_getaway.jpg
    - assets/images/vibes/city_exploration.jpg
    - assets/images/vibes/romantic_dinner.jpg
    - assets/images/vibes/board_games.jpg
    - assets/images/vibes/arcade_games.jpg
    - assets/images/vibes/study_dates.jpg
    - assets/images/vibes/movie_night.jpg
    - assets/images/login/ambient_bokeh.png
    - assets/images/boys-images/cafe_hoodie_portrait.png
    - assets/images/boys-images/rooftop_sunset_portrait.png
    - assets/images/boys-images/cafe_smiling_portrait.png
    - assets/images/boys-images/sunset_jacket_portrait.png
    - assets/images/boys-images/golden_hour_white_shirt.png
    - assets/images/boys-images/city_night_portrait.png
    - assets/images/boys-images/acoustic_guitar_portrait.png
    - assets/images/boys-images/daylight_sunglasses_portrait.png
    - assets/images/boys-images/sunset_car_sunglasses.png
    - assets/images/girls-images/golden_hour_portrait.png
    - assets/images/girls-images/cafe_coffee_portrait.png
    - assets/images/girls-images/sunset_floral_portrait.png
    - assets/images/girls-images/iced_coffee_portrait.png
    - assets/images/girls-images/cozy_headphones_portrait.png

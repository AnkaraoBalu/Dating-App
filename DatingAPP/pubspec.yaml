    - assets/images/girls-images/mirror_selfie_portrait.png
    - assets/images/girls-images/sunset_car_sunglasses.png
    - assets/images/welcome/personality_polaroids.png
    - assets/images/welcome/shared_energy_polaroids.png
    - assets/images/welcome/real_connection_polaroids.png
    - assets/images/welcome/new_chapter_polaroids.png

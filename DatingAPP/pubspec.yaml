  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope.ttf
          weight: 700
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/dm_serif_display/DMSerifDisplay-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/caveat/Caveat.ttf
          weight: 400

# Render Blueprint: deploys the API from backend/Dockerfile on every push to main.
# In Render: New + → Blueprint → pick this repo. Fill in the secret values when prompted.
services:
  - type: web
    name: matchify-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DEMO_AUTH_ENABLED
        value: "false"
      # Closed testing only: set to "true" in the dashboard to allow demo
      # sign-in on this production server. Turn off before public launch.
      - key: DEMO_AUTH_ALLOW_IN_PRODUCTION
        sync: false
      # Safety report emails. Set in the dashboard; REPORTS_EMAIL_TO is optional
      # and defaults to SMTP_USER.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: REPORTS_EMAIL_TO
        sync: false
      # Optional push notifications: upload the Firebase key as a Render
      # Secret File named firebase-admin.json, then set this to
      # /etc/secrets/firebase-admin.json. Leave empty to run without pushes.
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        sync: false
